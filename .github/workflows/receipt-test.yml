name: One-Time Paper Receipt Test

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  send-test:
    if: github.event.issue.title == '[bot-test] send paper receipt 2026-08-11'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bot
        run: pip install -e .

      - name: Send receipt test
        shell: bash
        run: |
          python - <<'PY'
          from swing_bot.config import load_config
          from swing_bot.entry_receipt import install_entry_receipt
          from swing_bot.responsive_runtime import ResponsiveDiscordAlerter

          install_entry_receipt()
          config = load_config('config/settings.yaml')
          alerts = config.section('alerts')
          alerter = ResponsiveDiscordAlerter(alerts, monitor_minutes=5)

          position = {
              'trade_id': 'TEST-RECEIPT-001',
              'ticker': 'AAPL',
              'score': 91,
              'entry_time': '2026-08-11T19:39:00-04:00',
              'entry_price': 227.15,
              'quantity': 44,
              'initial_notional': 9994.60,
              'account_value_at_entry': 10000.00,
              'cash_unused': 5.40,
              'allocation_percent': 99.946,
              'initial_stop': 224.90,
              'stop': 224.90,
              'initial_risk_dollars': 99.00,
              'tp1': 229.40,
              'tp2': 231.65,
              'target_1_quantity': 22,
              'target_2_quantity': 11,
              'remaining_quantity': 44,
              'sizing_mode': 'ALL_IN',
              'realized_pnl': 0.0,
              'last_return_percent': 0.0,
              'last_r_multiple': 0.0,
              'exits': [],
          }

          if not alerter.entry_alert(position):
              raise SystemExit('Discord receipt test failed')
          print('Receipt test sent successfully')
          PY
