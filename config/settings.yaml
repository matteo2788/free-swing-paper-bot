system:
  timezone: America/New_York
  market_calendar: NYSE
  trigger_interval: 15m
  data_period_intraday: 1mo
  data_period_daily: 1y
  scan_only_closed_candles: true
  request_batch_size: 60
  request_pause_seconds: 1.0

universe:
  source: sp500
  include_etfs:
    - SPY
    - QQQ
    - IWM
    - DIA
    - XLK
    - XLF
    - XLE
    - XLV
    - XLI
    - XLY
    - XLP
    - XLU
    - XLRE
    - XLB
    - XLC
  fallback_csv: config/universe_fallback.csv

context:
  min_price: 5.0
  min_avg_volume_20d: 1000000
  min_avg_dollar_volume_20d: 25000000
  min_daily_adx: 20.0
  min_atr_percent: 1.2
  max_atr_percent: 8.0
  relative_strength_lookback_days: 10
  daily_ema_fast: 20
  daily_ema_slow: 50
  four_hour_ema_fast: 20
  four_hour_ema_slow: 50

scoring:
  b_setup_threshold: 60
  a_setup_threshold: 80
  breakout_lookback_bars: 20
  overhead_lookback_bars: 80
  rvol_lookback_bars: 20
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14

regime:
  enabled: true
  data_period: 6mo
  ema_period: 20
  ema_slope_lookback_days: 5
  require_positive_ema_slopes: true
  atr_period: 14
  volatility_lookback_days: 20
  vix_symbol: ^VIX
  vix_expansion_ratio: 1.20
  atr_expansion_ratio: 1.25
  downside_lookback_days: 3
  downside_threshold_percent: -1.0

alpha:
  minimum_intraday_bars: 220
  watchlist_score: 60
  volatility_weight: 0.30
  relative_strength_weight: 0.30
  volume_weight: 0.20
  gamma_weight: 0.20
  bollinger_period: 20
  bollinger_std: 2.0
  keltner_period: 20
  keltner_atr_multiplier: 1.5
  squeeze_lookback_bars: 50
  squeeze_bandwidth_percentile_max: 10.0
  momentum_lookback_bars: 20
  momentum_smoothing_bars: 5
  relative_strength_z_min: 1.75
  rvol_lookback_bars: 20
  rvol_min: 2.5
  swing_high_lookback_bars: 80
  swing_high_wing_bars: 3
  atr_period: 14
  sector_etfs:
    Communication Services: XLC
    Consumer Discretionary: XLY
    Consumer Staples: XLP
    Energy: XLE
    Financials: XLF
    Health Care: XLV
    Industrials: XLI
    Information Technology: XLK
    Materials: XLB
    Real Estate: XLRE
    Utilities: XLU

options_gamma:
  enabled: false
  snapshot_path: data/options_gamma.json
  max_age_minutes: 60

paper_trading:
  enabled: true
  account_mode: single_atr_risk_parity
  minimum_trade_score: 80
  starting_account_value: 10000.0
  risk_per_trade_percent: 2.0
  max_position_notional_percent: 100.0
  max_open_positions: 1
  entry_buffer_percent: 0.15
  pending_expiry_trading_days: 2
  time_stop_trading_days: 5
  stop_atr_multiple: 1.5
  target_1_atr_multiple: 1.5
  target_2_atr_multiple: 2.5
  trailing_atr_multiple: 2.0
  atr_period: 14
  target_1_exit_fraction: 0.50
  target_2_exit_fraction: 0.25
  runner_exit_fraction: 0.25
  slippage_percent: 0.05
  transaction_fee_percent: 0.01
  early_invalidation_bars: 3
  # Retained for backwards-compatible legacy modules; quant runtime uses ATR multiples above.
  target_1_r: 1.0
  target_2_r: 2.0
  runner_ema_period_1h: 20
  minimum_stop_percent: 0.35
  maximum_stop_percent: 4.0
  monitor_interval: 5m
  monitor_data_period: 5d

alerts:
  username: Free Swing Paper Bot
  send_b_setups: true
  send_a_setups: true
  send_daily_open_position_summary: true
  mention_everyone: false

storage:
  runtime_state: state/runtime.json
  trades_csv: data/trades.csv
  events_jsonl: data/events.jsonl
  commit_marker: state/commit_required
